<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg3"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547c9f"/></marker>
    <filter id="sh3"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#173b63" flood-opacity=".12"/></filter>
    <style>.t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#173b63}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#617b96}.h{font-size:28px;font-weight:700}.b{font-size:20px}.s{font-size:18px}.box{fill:#fff;stroke:#b8ccdf;stroke-width:2}.arrow{stroke:#547c9f;stroke-width:4;fill:none;marker-end:url(#arr3)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <text x="70" y="72" class="t title">作业链路变化：从“常驻 Slurm 层”到“任务 Pod 直接占卡”</text>
  <text x="70" y="110" class="t sub">两种方式都运行在 Kubernetes 内，但资源所有权和调度入口不同</text>

  <rect x="70" y="155" width="700" height="645" rx="28" fill="#fff8f3" stroke="#dd8452" stroke-width="3" filter="url(#sh3)"/>
  <text x="110" y="210" class="t h">现状：Slurm + Slinky</text>
  <text x="110" y="245" class="t s">先维持一套 Slurm 集群，再向其中提交作业</text>
  <g>
    <rect x="125" y="290" width="190" height="80" rx="16" class="box"/><text x="220" y="324" text-anchor="middle" class="t b">用户</text><text x="220" y="352" text-anchor="middle" class="t s">kubectl exec</text>
    <path d="M315 330H380" class="arrow"/>
    <rect x="380" y="290" width="220" height="80" rx="16" class="box"/><text x="490" y="324" text-anchor="middle" class="t b">Login Pod</text><text x="490" y="352" text-anchor="middle" class="t s">sbatch / squeue</text>
    <path d="M490 370V425" class="arrow"/>
    <rect x="370" y="425" width="240" height="85" rx="16" fill="#fff0e8" stroke="#dd8452" stroke-width="2"/><text x="490" y="460" text-anchor="middle" class="t b">slurmctld</text><text x="490" y="488" text-anchor="middle" class="t s">Partition / GRES / QOS</text>
    <path d="M370 468H295" class="arrow"/><path d="M610 468H685" class="arrow"/>
    <rect x="105" y="425" width="190" height="130" rx="16" fill="#fff0e8" stroke="#dd8452" stroke-width="2"/><text x="200" y="462" text-anchor="middle" class="t b">Worker Pod 0</text><text x="200" y="492" text-anchor="middle" class="t s">slurmd 常驻</text><text x="200" y="525" text-anchor="middle" class="t s">预先占用 GPU</text>
    <rect x="685" y="425" width="55" height="130" rx="16" fill="#fff0e8" stroke="#dd8452" stroke-width="2"/><text x="712" y="485" text-anchor="middle" class="t b">…</text>
    <rect x="155" y="610" width="530" height="75" rx="18" fill="#dd8452"/><text x="420" y="642" text-anchor="middle" fill="#fff" font-size="20" font-weight="700" font-family="sans-serif">Apptainer --nv · NFS · torchrun</text><text x="420" y="670" text-anchor="middle" fill="#fff" font-size="17" font-family="sans-serif">作业运行在常驻 Worker Pod 内</text>
    <rect x="155" y="715" width="530" height="48" rx="24" fill="#fde2d4"/><text x="420" y="746" text-anchor="middle" font-size="20" font-weight="700" fill="#a84d22" font-family="sans-serif">代价：第二套账 + 常驻层 + GPU 静态分池</text>
  </g>

  <rect x="830" y="155" width="700" height="645" rx="28" fill="#f2fbf7" stroke="#41a071" stroke-width="3" filter="url(#sh3)"/>
  <text x="870" y="210" class="t h">目标：Kubernetes + Volcano</text>
  <text x="870" y="245" class="t s">提交任务对象，由任务 Pod 直接申请并占用 GPU</text>
  <g>
    <rect x="885" y="290" width="190" height="80" rx="16" class="box"/><text x="980" y="324" text-anchor="middle" class="t b">用户 / CI</text><text x="980" y="352" text-anchor="middle" class="t s">kubectl apply</text>
    <path d="M1075 330H1140" class="arrow"/>
    <rect x="1140" y="290" width="245" height="80" rx="16" class="box"/><text x="1262" y="324" text-anchor="middle" class="t b">Kubernetes API</text><text x="1262" y="352" text-anchor="middle" class="t s">Job / PodGroup / vcjob</text>
    <path d="M1262 370V425" class="arrow"/>
    <rect x="1115" y="425" width="295" height="85" rx="16" fill="#e7f7ef" stroke="#41a071" stroke-width="2"/><text x="1262" y="460" text-anchor="middle" class="t b">Volcano Scheduler</text><text x="1262" y="488" text-anchor="middle" class="t s">Queue / Gang / Priority</text>
    <path d="M1262 510V570" class="arrow"/>
    <rect x="895" y="570" width="560" height="105" rx="18" fill="#e7f7ef" stroke="#41a071" stroke-width="2"/>
    <rect x="930" y="600" width="125" height="48" rx="12" fill="#41a071"/><rect x="1090" y="600" width="125" height="48" rx="12" fill="#41a071"/><rect x="1250" y="600" width="125" height="48" rx="12" fill="#41a071"/>
    <text x="992" y="631" text-anchor="middle" fill="#fff" class="s">Train Pod</text><text x="1152" y="631" text-anchor="middle" fill="#fff" class="s">Train Pod</text><text x="1312" y="631" text-anchor="middle" fill="#fff" class="s">Train Pod</text>
    <rect x="895" y="715" width="560" height="48" rx="24" fill="#d9f3e6"/><text x="1175" y="746" text-anchor="middle" font-size="20" font-weight="700" fill="#257553" font-family="sans-serif">收益：Pod 直接占卡，训练与推理共享资源池</text>
  </g>

  <path d="M780 480H820" stroke="#0e4e96" stroke-width="5" marker-end="url(#arr3)"/>
  <text x="800" y="450" text-anchor="middle" class="t h">迁移</text>
  <text x="800" y="855" text-anchor="middle" class="t h">保留边界：传统 MPI、sacct 审计、Reservation 等需求继续由 Slurm 承担</text>
</svg>
