<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg4"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#ecf3fa"/></linearGradient>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5a7895"/></marker>
    <style>.t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#173b63}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#617b96}.h{font-size:28px;font-weight:700}.b{font-size:21px}.s{font-size:18px}.arr{stroke:#5a7895;stroke-width:4;fill:none;marker-end:url(#arr4)}.box{fill:#fff;stroke:#b8ccdf;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg4)"/>
  <text x="70" y="72" class="t title">资源不足时：默认等待，不是立即失败</text>
  <text x="70" y="110" class="t sub">训练按组等待，推理按副本等待；资源释放后自动继续</text>

  <rect x="70" y="155" width="1460" height="270" rx="26" fill="#f3f8ff" stroke="#4f8ed0" stroke-width="3"/>
  <text x="110" y="205" class="t h">训练任务 · 带 Gang（minAvailable = 4）</text>
  <rect x="115" y="255" width="250" height="90" rx="18" class="box"/><text x="240" y="292" text-anchor="middle" class="t b">提交 4 个 Worker</text><text x="240" y="322" text-anchor="middle" class="t s">PodGroup / vcjob</text>
  <path d="M365 300H455" class="arr"/>
  <rect x="455" y="255" width="250" height="90" rx="18" fill="#fff4df" stroke="#d6a64b" stroke-width="2"/><text x="580" y="292" text-anchor="middle" class="t b">仅有 3 张可用 GPU</text><text x="580" y="322" text-anchor="middle" class="t s">不满足 minAvailable</text>
  <path d="M705 300H795" class="arr"/>
  <rect x="795" y="245" width="260" height="110" rx="18" fill="#fff0f0" stroke="#cf6666" stroke-width="2"/><text x="925" y="286" text-anchor="middle" class="t h">Inqueue</text><text x="925" y="320" text-anchor="middle" class="t s">整组不启动，避免部分调度死锁</text>
  <path d="M1055 300H1145" class="arr"/>
  <rect x="1145" y="255" width="310" height="90" rx="18" fill="#e5f6ed" stroke="#41a071" stroke-width="2"/><text x="1300" y="292" text-anchor="middle" class="t b">资源满足 → 4 Pod 同步运行</text><text x="1300" y="322" text-anchor="middle" class="t s">Running → Completed</text>

  <rect x="70" y="465" width="1460" height="270" rx="26" fill="#f7fbf8" stroke="#41a071" stroke-width="3"/>
  <text x="110" y="515" class="t h">推理服务 · Deployment（无 PodGroup）</text>
  <rect x="115" y="565" width="250" height="90" rx="18" class="box"/><text x="240" y="602" text-anchor="middle" class="t b">期望副本数 2</text><text x="240" y="632" text-anchor="middle" class="t s">已有 1 个副本服务中</text>
  <path d="M365 610H455" class="arr"/>
  <rect x="455" y="565" width="250" height="90" rx="18" fill="#fff4df" stroke="#d6a64b" stroke-width="2"/><text x="580" y="602" text-anchor="middle" class="t b">没有空闲 GPU</text><text x="580" y="632" text-anchor="middle" class="t s">新副本无法放置</text>
  <path d="M705 610H795" class="arr"/>
  <rect x="795" y="555" width="260" height="110" rx="18" fill="#fff0f0" stroke="#cf6666" stroke-width="2"/><text x="925" y="596" text-anchor="middle" class="t h">Pending</text><text x="925" y="630" text-anchor="middle" class="t s">已有副本继续服务，不整体失败</text>
  <path d="M1055 610H1145" class="arr"/>
  <rect x="1145" y="565" width="310" height="90" rx="18" fill="#e5f6ed" stroke="#41a071" stroke-width="2"/><text x="1300" y="602" text-anchor="middle" class="t b">资源释放 → 自动补齐副本</text><text x="1300" y="632" text-anchor="middle" class="t s">Ready replicas = 2</text>

  <rect x="265" y="785" width="1070" height="66" rx="30" fill="#0e4e96"/>
  <text x="800" y="827" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" font-family="sans-serif">控制等待策略：Queue 配额 · PriorityClass · Preemption · activeDeadlineSeconds / Job Policy</text>
</svg>
