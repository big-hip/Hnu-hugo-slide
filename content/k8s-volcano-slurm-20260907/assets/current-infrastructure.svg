<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eaf2fb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173b63" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0e4e96"/>
    </marker>
    <style>
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#173b63}.title{font-size:42px;font-weight:700}.sub{font-size:23px;fill:#54708d}.h{font-size:27px;font-weight:700}.b{font-size:21px}.s{font-size:18px;fill:#54708d}.card{fill:#fff;stroke:#cbdced;stroke-width:2}.node{fill:#eef5fc;stroke:#76a5d1;stroke-width:2}.gpu{fill:#e8f7f0;stroke:#53a67d;stroke-width:2}.slurm{fill:#fff3ed;stroke:#dd8452;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="72" class="t title">当前基础设施：同一 Kubernetes 底座上的两套调度账本</text>
  <text x="80" y="110" class="t sub">3 个节点 · 2 个 GPU 节点 · Serving 与 Slurm Worker 静态分池</text>

  <rect x="70" y="150" width="1460" height="650" rx="28" class="card" filter="url(#shadow)"/>
  <text x="110" y="198" class="t h">Kubernetes v1.35.6 / containerd</text>

  <rect x="110" y="230" width="360" height="160" rx="18" class="node"/>
  <text x="140" y="270" class="t h">mn1 · Control Plane</text>
  <text x="140" y="306" class="t b">10.110.1.83</text>
  <text x="140" y="340" class="t s">API Server · etcd · Controller</text>
  <text x="140" y="368" class="t s">kube-scheduler</text>

  <rect x="550" y="230" width="430" height="160" rx="18" class="gpu"/>
  <text x="580" y="270" class="t h">gpu1 · Worker</text>
  <text x="580" y="306" class="t b">10.110.1.81 · A100 × 4</text>
  <rect x="580" y="330" width="150" height="36" rx="18" fill="#0e4e96"/>
  <text x="655" y="355" text-anchor="middle" font-size="18" fill="#fff" font-family="sans-serif">vLLM Serving</text>
  <rect x="750" y="330" width="190" height="36" rx="18" fill="#dd8452"/>
  <text x="845" y="355" text-anchor="middle" font-size="18" fill="#fff" font-family="sans-serif">Slurm Worker Pod</text>

  <rect x="1050" y="230" width="430" height="160" rx="18" class="gpu"/>
  <text x="1080" y="270" class="t h">gpu2 · Worker</text>
  <text x="1080" y="306" class="t b">10.110.1.82 · A100 × 4</text>
  <rect x="1080" y="330" width="150" height="36" rx="18" fill="#0e4e96"/>
  <text x="1155" y="355" text-anchor="middle" font-size="18" fill="#fff" font-family="sans-serif">vLLM Serving</text>
  <rect x="1250" y="330" width="190" height="36" rx="18" fill="#dd8452"/>
  <text x="1345" y="355" text-anchor="middle" font-size="18" fill="#fff" font-family="sans-serif">Slurm Worker Pod</text>

  <rect x="110" y="450" width="620" height="250" rx="20" fill="#edf5ff" stroke="#0e4e96" stroke-width="2"/>
  <text x="145" y="492" class="t h">Kubernetes 调度域</text>
  <text x="145" y="532" class="t b">Deployment / Service → kube-scheduler</text>
  <text x="145" y="572" class="t b">典型负载：vLLM、SGLang、AIBrix</text>
  <text x="145" y="625" class="t s">资源表达：nvidia.com/gpu</text>
  <rect x="145" y="648" width="535" height="34" rx="17" fill="#d9eafe"/>
  <text x="412" y="672" text-anchor="middle" class="t s">面向在线推理，Pod 级资源调度</text>

  <rect x="870" y="450" width="610" height="250" rx="20" class="slurm"/>
  <text x="905" y="492" class="t h">Slinky / Slurm 调度域</text>
  <text x="905" y="532" class="t b">Login Pod → sbatch → slurmctld</text>
  <text x="905" y="572" class="t b">常驻 Worker Pod → slurmd → Apptainer</text>
  <text x="905" y="625" class="t s">资源表达：GRES gpu:A100:N</text>
  <rect x="905" y="648" width="525" height="34" rx="17" fill="#ffe0d0"/>
  <text x="1167" y="672" text-anchor="middle" class="t s">面向训练/HPC，Job 级资源调度</text>

  <path d="M730 575H870" stroke="#c84c4c" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="800" y="548" text-anchor="middle" font-size="20" font-weight="700" fill="#c84c4c" font-family="sans-serif">两套账</text>
  <path d="M800 570V405" stroke="#0e4e96" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="744" text-anchor="middle" class="t h">核心问题：GPU 池静态分离，资源不能按需弹性互借</text>
  <rect x="500" y="820" width="600" height="48" rx="24" fill="#0e4e96"/>
  <text x="800" y="852" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="sans-serif">目标：统一资源池，同时保留必要的传统 HPC 能力</text>
</svg>
